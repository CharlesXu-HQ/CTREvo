[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrevo"
version = "0.1.0"
description = "Agent-led CTR model experiments with ModelEvoHarness"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pandas>=2", "torch>=2.2", "scikit-learn>=1.5"]

[project.scripts]
ctrevo = "ctrevo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
